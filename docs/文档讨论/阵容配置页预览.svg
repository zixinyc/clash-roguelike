<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#0d1922"/><g font-family="Microsoft YaHei, sans-serif"><text x="65" y="80" font-size="34" fill="#e7dfd2">阵容配置</text><text x="65" y="120" font-size="18" fill="#9bb4b8">选择出战角色与敌人，准备一场测试战斗</text>
<rect x="65" y="155" width="840" height="600" rx="10" fill="#14232d" stroke="#536c70"/><text x="90" y="198" font-size="21" fill="#d7c49d">选择角色</text><text x="90" y="228" font-size="16" fill="#8ea5a8">点击选择 1～3 名角色，可单人出战</text>
<rect x="90" y="255" width="240" height="190" rx="8" fill="#20323c" stroke="#556b71"/><text x="110" y="300" font-size="23" fill="#ddd4c1">灰烬</text><text x="110" y="335" font-size="16" fill="#9ab3b4">蓄势 · 把握关键拼点</text>
<rect x="350" y="255" width="240" height="190" rx="8" fill="#20353c" stroke="#92d7dd" stroke-width="3"/><text x="370" y="300" font-size="23" fill="#e2e2d7">ZiXi ✓</text><text x="370" y="335" font-size="16" fill="#a0c9ce">观测 · 拼点与强化</text>
<rect x="610" y="255" width="240" height="190" rx="8" fill="#20323c" stroke="#556b71"/><text x="630" y="300" font-size="23" fill="#ddd4c1">织火</text><text x="630" y="335" font-size="16" fill="#9ab3b4">援护 · 防御与支援</text>
<rect x="90" y="465" width="240" height="190" rx="8" fill="#20323c" stroke="#556b71"/><text x="110" y="510" font-size="23" fill="#ddd4c1">长锋</text><text x="110" y="545" font-size="16" fill="#9ab3b4">破阵 · 高风险进攻</text>
<rect x="350" y="465" width="240" height="190" rx="8" fill="#20323c" stroke="#556b71"/><text x="370" y="510" font-size="23" fill="#ddd4c1">咲夜</text><text x="370" y="545" font-size="16" fill="#9ab3b4">时停 · 速度与连击</text>
<rect x="610" y="465" width="240" height="190" rx="8" fill="#20323c" stroke="#556b71"/><text x="630" y="510" font-size="23" fill="#ddd4c1">灵梦</text><text x="630" y="545" font-size="16" fill="#9ab3b4">符卡 · 灵力与蓄能</text>
<rect x="930" y="155" width="445" height="600" rx="10" fill="#14232d" stroke="#536c70"/><text x="960" y="198" font-size="21" fill="#d7c49d">本场设置</text><text x="960" y="255" font-size="18" fill="#a6b8ba">快速选择</text><rect x="960" y="273" width="170" height="47" rx="4" fill="#31515a" stroke="#92d7dd"/><text x="1045" y="303" text-anchor="middle" font-size="18" fill="#f0ede5">一人出战</text><rect x="1145" y="273" width="180" height="47" rx="4" fill="#1b2b34" stroke="#50656d"/><text x="1235" y="303" text-anchor="middle" font-size="18" fill="#c2cdcb">恢复默认</text>
<text x="960" y="380" font-size="18" fill="#a6b8ba">敌人组合</text><rect x="960" y="400" width="365" height="52" rx="4" fill="#1d3038" stroke="#61777a"/><text x="980" y="433" font-size="18" fill="#e1dfd4">斥候 / 盾卫                ▾</text><text x="960" y="515" font-size="18" fill="#c5d3d0">出战：ZiXi · 1 人</text><text x="960" y="552" font-size="16" fill="#92a6a8">人数可自由选择，最多 3 人</text>
<rect x="960" y="660" width="365" height="60" rx="5" fill="#d8b879"/><text x="1142" y="699" text-anchor="middle" font-size="22" fill="#192527">开始战斗</text><text x="65" y="820" font-size="17" fill="#82999d">界面草案 · 实际操作和文字以实现后为准</text></g></svg>