<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>《余烬交锋》战斗音效试听</title>
<style>
  :root{
    --bg:#16161a; --panel:#1e1e24; --line:#33333c;
    --text:#e6e6ec; --muted:#9a9aa6; --accent:#ffb054; --accent2:#7fd4ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 30px 60px;
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    font-size:14px; line-height:1.7;
  }
  h1{font-size:20px; margin:0 0 6px; letter-spacing:.5px}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px}
  .note{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:6px; padding:12px 16px; margin-bottom:22px; color:var(--muted); font-size:13px;
  }
  .note em{color:var(--accent2); font-style:normal}
  h2{
    font-size:15px; margin:26px 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--line); color:var(--accent);
  }
  .row{
    display:flex; align-items:center; gap:14px;
    padding:9px 12px; border-radius:6px; background:var(--panel);
    margin-bottom:6px; border:1px solid transparent;
  }
  .row:hover{border-color:var(--line)}
  .name{width:170px; flex:none; color:var(--text)}
  .file{width:210px; flex:none; color:var(--muted); font-family:Consolas,monospace; font-size:12px}
  .dur{width:60px; flex:none; color:var(--muted); font-size:12px}
  audio{flex:1; height:32px}
  .tip{color:var(--muted); font-size:12px; margin:16px 0 0}
  img.sheet{width:100%; border:1px solid var(--line); border-radius:6px; margin-top:10px}
</style>
</head>
<body>

<h1>《余烬交锋》战斗音效试听</h1>
<div class="sub">12 类音效 × 2 个变体，44.1kHz / 16bit / 单声道 WAV</div>

<div class="note">
  用浏览器直接打开这个文件就能听（<em>file://</em> 路径下也能播放旁边的音频）。
  每个音效有两个变体（a / b），游戏里随机取用可以避免重复听感。
  波形图在页面最下面。
</div>

<div id="list"></div>

<div class="tip">提示：把音量开到能听清细节但不太吵的程度，金属碰撞和命中这两组的差别最明显。</div>

<h2>波形表</h2>
<img class="sheet" src="_wave_sheet.png" alt="音效波形表">

<script>
const GROUPS = [
  { title: "界面", items: [
    ["界面悬停", "sfx_ui_hover", 0.09],
    ["按钮点击", "sfx_ui_click", 0.12],
    ["选中卡牌", "sfx_ui_select_card", 0.30],
    ["无效操作提示", "sfx_ui_error", 0.34]
  ]},
  { title: "拼点", items: [
    ["拼点碰撞（金属交击）", "sfx_clash_metal", 0.85],
    ["硬币破碎", "sfx_clash_coin_break", 0.75]
  ]},
  { title: "受击", items: [
    ["命中受击（沉闷肉体打击）", "sfx_hit_flesh", 0.55],
    ["斩击（刀锋呼啸）", "sfx_hit_slash", 0.50],
    ["格挡 / 迎击", "sfx_guard_block", 0.70]
  ]},
  { title: "技能与结算", items: [
    ["技能发动（蓄力上涌）", "sfx_skill_cast", 0.90],
    ["胜利", "sfx_victory", 1.40],
    ["失败", "sfx_defeat", 1.50]
  ]}
];

const list = document.getElementById("list");
let current = null;

for (const g of GROUPS) {
  const h = document.createElement("h2");
  h.textContent = g.title;
  list.appendChild(h);
  for (const [cn, id, dur] of g.items) {
    for (const v of ["a", "b"]) {
      const row = document.createElement("div");
      row.className = "row";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = cn;

      const file = document.createElement("div");
      file.className = "file";
      file.textContent = `${id}_${v}.wav`;

      const d = document.createElement("div");
      d.className = "dur";
      d.textContent = dur.toFixed(2) + "s";

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = `${id}_${v}.wav`;
      audio.addEventListener("play", () => {
        if (current && current !== audio) current.pause();
        current = audio;
      });

      row.append(name, file, d, audio);
      list.appendChild(row);
    }
  }
}
</script>
</body>
</html>
